{% extends 'base.html' %}
{% block content %}
<h2>Teacher Portal - Assigned Class: {{ teacher.assigned_class }}</h2>

<div class="card">
  <h3>Compile Student Scores</h3>
  <form action="{{ url_for('enter_scores') }}" method="POST">
    <label>Select Student:</label>
    <select name="student_id" required>
      {% for std in students %}
      <option value="{{ std.user.id }}">{{ std.user.full_name }} ({{ std.admission_number }})</option>
      {% endfor %}
    </select>
    
    <label>Select Subject:</label>
    <select name="subject_id" required>
      {% for sub in subjects %}
      <option value="{{ sub.id }}">{{ sub.name }} ({{ sub.code }})</option>
      {% endfor %}
    </select>
    
    <div style="display: flex; gap: 10px;">
      <input type="number" step="0.1" max="15" name="ca1" placeholder="CA 1 (Max 15)" required>
      <input type="number" step="0.1" max="15" name="ca2" placeholder="CA 2 (Max 15)" required>
      <input type="number" step="0.1" max="70" name="exam" placeholder="Exam (Max 70)" required>
    </div>
    
    <button type="submit" class="btn-primary">Save Assessment Record</button>
  </form>
</div>
{% endblock %}
