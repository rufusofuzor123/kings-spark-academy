{% extends "base.html" %}
{% block content %}
<div class="container my-4">
    <h2>Manage Student Attendance Register</h2>
    
    <div class="card p-4 shadow-sm mb-4">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Student</label>
                    <select name="student_id" class="form-select" required>
                        {% for s in students %}
                            <option value="{{ s.id }}">{{ s.username }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Class</label>
                    <input type="text" name="class_name" class="form-control" placeholder="e.g. SS 1" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select" required>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Late">Late</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Mark Attendance</button>
        </form>
    </div>

    <h4>Attendance Log</h4>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Date</th>
                <th>Student</th>
                <th>Class</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for r in records %}
            <tr>
                <td>{{ r.date }}</td>
                <td>{{ r.student.username }}</td>
                <td>{{ r.class_name }}</td>
                <td>
                    <span class="badge bg-{{ 'success' if r.status == 'Present' else ('danger' if r.status == 'Absent' else 'warning') }}">
                        {{ r.status }}
                    </span>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
